<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Richieste clienti | FLORA VOLT</title><link rel="stylesheet" href="/style.css"><style>main{max-width:960px;margin:auto;padding:36px 20px}article{background:white;border:1px solid #ced4ce;border-radius:14px;padding:18px;margin:12px 0;overflow-wrap:anywhere}article a,article select{display:inline-block;margin:6px 16px 6px 0;padding:8px}article small{display:block}button{cursor:pointer}h1{font-size:clamp(36px,7vw,80px)}body{background:#f3f4ee;color:#16221b}</style><main><small>FLORA VOLT / AREA VENDITE</small><h1>Richieste clienti.</h1><p id="notice" role="status">Caricamento…</p><section id="rows"></section><button id="more" class="pill" hidden>Richieste precedenti</button></main><script>
const box=document.querySelector('#rows'),notice=document.querySelector('#notice'),more=document.querySelector('#more');let topId=null,page=null,busy=false;
function el(tag,text){const a=document.createElement(tag);a.textContent=text;return a}
function card(r){const a=el('article','');a.append(el('small',r.origine+' · '+r.creata+' UTC'),el('h2',r.nome+' '+r.cognome));if(r.tinta)a.append(el('p',r.tinta));for(const [url,t] of [['tel:'+r.telefono,r.telefono],['mailto:'+r.email,r.email]]){const l=el('a',t);l.href=url;a.append(l)}
const select=el('select','');select.setAttribute('aria-label','Stato della richiesta di '+r.nome);for(const v of ['Nuova','Da richiamare','Contattata','Chiusa']){const o=el('option',v);o.selected=v===r.stato;select.append(o)}select.onchange=async()=>{select.disabled=true;try{const res=await fetch('/api/vendite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:r.id,stato:select.value})});if(!res.ok)throw Error();r.stato=select.value;notice.textContent='Stato aggiornato.'}catch{select.value=r.stato;notice.textContent='Aggiornamento non riuscito.'}select.disabled=false};a.append(select);return a}
async function load(mode){if(busy)return;busy=true;try{const res=await fetch('/api/vendite'+(mode==='older'?'?prima='+page:''));if(!res.ok)throw Error();let data=await res.json();
if(mode==='poll'&&topId!==null){if(data[0]?.id>topId){notice.textContent='Nuove richieste ricevute. Aggiorna la lista per visualizzarle.';document.title='Nuove richieste | FLORA VOLT';if(!document.querySelector('#refresh')){const b=el('button','Aggiorna lista');b.id='refresh';b.onclick=()=>location.reload();notice.after(b)}}return}
if(data.length){if(mode!=='older')topId=data[0].id;page=data.at(-1).id;data.forEach(r=>box.append(card(r)));notice.textContent='Richieste in ordine di arrivo, dalla più recente.'}else if(!box.children.length)notice.textContent='Nessuna richiesta ricevuta. Le nuove richieste appariranno qui.';more.hidden=data.length<50}
catch{notice.textContent='Impossibile caricare le richieste. Riprova.'}finally{busy=false}}
more.onclick=()=>load('older');load('first');setInterval(()=>load('poll'),15000)</script></html>
